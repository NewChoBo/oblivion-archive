<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c1014; color: #ebe3ce; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading { position: fixed; inset: 0; display: grid; place-content: center; font: 16px system-ui; }
      #loading[hidden] { display: none; }
      progress { accent-color: #b89c69; width: min(50vw, 18rem); }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0" aria-label="Oblivion Archive"></canvas>
    <div id="loading" role="status"><progress max="1" aria-label="Loading"></progress></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.getElementById('unity-canvas');
      const loading = document.getElementById('loading');
      const progress = loading.querySelector('progress');
      createUnityInstance(canvas, {
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
#endif
        streamingAssetsUrl: 'StreamingAssets',
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
      }, value => { progress.value = value; }).then(() => {
        loading.hidden = true;
        canvas.focus({ preventScroll: true });
      }).catch(error => { loading.textContent = String(error); });
    </script>
  </body>
</html>
