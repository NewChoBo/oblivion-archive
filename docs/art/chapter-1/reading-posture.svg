<text x="1095.0" y="691.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">1</text>
<circle cx="1110.0" cy="498.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="1110.0" y="502.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">2</text>
