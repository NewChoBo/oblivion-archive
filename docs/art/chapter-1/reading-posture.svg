<text x="1095.0" y="351.1" text-anchor="middle" fill="white" font-weight="700" font-size="13">3</text>
<circle cx="1346.2" cy="390.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="1346.2" y="394.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">4</text>
<text x="805.0" y="786.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="18">① 시작　② 사진　③ 북쪽 아치　④ 귀환문</text>
<text x="805.0" y="818.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">귀환 때에는 기록대 동쪽 끝을 돌아 남향 액자의 앞면을 본다.</text>
<polyline points="44.00,873.00 1396.00,873.00" fill="none" stroke="#536668" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="44.0" y="909.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">치수는 이 게임의 모델·카메라용 설계값  ·  평면 좌표는 본관의 게임 좌표  ·  좌우 우회와 시선은 각각 따로 표시</text>
<text x="1396.0" y="909.0" text-anchor="end" fill="#236b67" font-weight="700" font-size="16">망각의 서재  /  현행 제작 기준</text>
</svg>
