<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img">
<title>열람동과 본관  /  앉아서 읽고, 서서 찾는 자리</title><desc>왼쪽은 서쪽 열람동 가구의 옆면, 오른쪽은 본관 사진 기록대의 첫 접근 평면이다. 두 공간은 용도가 다르다.</desc>
<style>text{font-family:"Malgun Gothic",sans-serif}</style>
<rect width="1440" height="940" fill="#f6f3e9"/>
<text x="44.0" y="56.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="32">열람동과 본관  /  앉아서 읽고, 서서 찾는 자리</text>
<text x="44.0" y="92.0" text-anchor="start" fill="#536668" font-weight="400" font-size="17">왼쪽은 서쪽 열람동 가구의 옆면, 오른쪽은 본관 사진 기록대의 첫 접근 평면이다. 두 공간은 용도가 다르다.</text>
<polyline points="44.00,115.00 1396.00,115.00" fill="none" stroke="#1f3336" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56.0" y="173.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="22">열람동  /  앉은 사람의 무릎과 등 뒤</text>
<polygon points="105.00,390.00 347.00,390.00 347.00,376.80 105.00,376.80" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="122.60,544.00 140.20,544.00 140.20,390.00 122.60,390.00" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="219.40,544.00 237.00,544.00 237.00,390.00 219.40,390.00" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="373.40,458.20 474.60,458.20 474.60,447.20 373.40,447.20" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="384.40,544.00 399.80,544.00 399.80,458.20 384.40,458.20" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="461.40,544.00 474.60,544.00 474.60,361.40 461.40,361.40" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="78.60,544.00 738.60,544.00" fill="none" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="474.60,517.60 738.60,517.60" fill="none" stroke="#236b67" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="490.0" y="499.0" text-anchor="start" fill="#236b67" font-weight="400" font-size="16">등 뒤 통행 1.20 m</text>
<text x="70.0" y="329.0" text-anchor="start" fill="#9d4b2f" font-weight="400" font-size="17">상판 +0.76</text>
<text x="396.0" y="410.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">등 +0.83</text>
<text x="389.0" y="478.0" text-anchor="start" fill="#9d4b2f" font-weight="400" font-size="16">좌면 +0.44</text>
<text x="65.0" y="623.0" text-anchor="start" fill="#536668" font-weight="400" font-size="18">상판 밑 +0.70 m. 앉는 쪽에서 안으로 0.45 m는</text>
<text x="65.0" y="653.0" text-anchor="start" fill="#536668" font-weight="400" font-size="18">가로 보강대와 앞다리를 비워 무릎이 들어가게 한다.</text>
<text x="65.0" y="715.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">현행 1.015 m 작업대와 높이 0.88 m의 통짜 벤치를 교체한다.</text>
<polyline points="766.00,145.00 766.00,826.00" fill="none" stroke="#536668" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="800.0" y="173.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="22">본관  /  열람실 첫 접근</text>
