<text x="866.0" y="305.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">제본공</text>
<text x="866.0" y="335.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">수선할 책만 서쪽 공방으로 보낸다.</text>
<text x="866.0" y="359.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">천구 남쪽을 지나 아케이드 개구부로 운반한다.</text>
<circle cx="842.0" cy="420.0" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="842.0" y="424.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">3</text>
<text x="866.0" y="425.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">서기관</text>
<text x="866.0" y="455.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">대계단 아래에서 손으로 들 분량을 정한다.</text>
<text x="866.0" y="479.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">계단에 수레 자국이나 하역 상자를 두지 않는다.</text>
<circle cx="842.0" cy="540.0" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="842.0" y="544.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">4</text>
<text x="866.0" y="545.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">처음 온 플레이어</text>
<text x="866.0" y="575.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">석교에서는 별창, 정문에서는 사진이 시선을 받는다.</text>
<text x="866.0" y="599.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">본편의 기본 시작점은 열람실이다.</text>
<circle cx="842.0" cy="660.0" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="842.0" y="664.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">5</text>
<text x="866.0" y="665.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">돌아오는 플레이어</text>
<text x="866.0" y="695.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">원부를 찾은 뒤 동쪽 빗장을 열면 사진으로 돌아온다.</text>
<text x="866.0" y="719.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">일하는 사람의 출입문을 귀환문과 구별한다.</text>
<polyline points="60.00,838.00 120.00,838.00" fill="none" stroke="#1f3336" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65.0" y="829.0" text-anchor="start" fill="#536668" font-weight="400" font-size="13">10 m</text>
<polyline points="44.00,873.00 1396.00,873.00" fill="none" stroke="#536668" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="44.0" y="909.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">청록 실선  방문 동선      적갈 실선  운반      적갈 점선  소분 후 손운반</text>
<text x="1396.0" y="909.0" text-anchor="end" fill="#236b67" font-weight="700" font-size="16">망각의 서재  /  현행 제작 기준</text>
