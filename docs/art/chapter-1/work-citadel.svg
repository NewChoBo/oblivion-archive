<text x="866.0" y="185.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">하역인</text>
<text x="866.0" y="215.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">동쪽 하역문에서 창고로 인수한다.</text>
<text x="866.0" y="239.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">닫힌 상자는 광장 층에서 분류한다.</text>
