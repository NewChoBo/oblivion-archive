<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img">
<title>제본 공방  /  접지에서 책이 되기까지</title><desc>원화 시점은 동쪽 문에서 서쪽. 평면은 북쪽 ↑. 남벽에 앉아서 꿰매는 자리와 서서 누르는 자리를 차례로 놓는다.</desc>
<style>text{font-family:"Malgun Gothic",sans-serif}</style>
<rect width="1440" height="940" fill="#f6f3e9"/>
<text x="44.0" y="56.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="32">제본 공방  /  접지에서 책이 되기까지</text>
<text x="44.0" y="92.0" text-anchor="start" fill="#536668" font-weight="400" font-size="17">원화 시점은 동쪽 문에서 서쪽. 평면은 북쪽 ↑. 남벽에 앉아서 꿰매는 자리와 서서 누르는 자리를 차례로 놓는다.</text>
<polyline points="44.00,115.00 1396.00,115.00" fill="none" stroke="#1f3336" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="122.00,651.00 782.00,651.00 782.00,189.00 122.00,189.00" fill="#e7e1d3" stroke="#1f3336" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="782.00,525.60 782.00,651.00 122.00,651.00 122.00,189.00 782.00,189.00 782.00,314.40" fill="none" stroke="#1f3336" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="481.70,614.70 640.10,614.70 640.10,542.10 481.70,542.10" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="201.20,598.20 359.60,598.20 359.60,525.60 201.20,525.60" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="183.71,276.45 449.69,276.45 449.69,240.15 183.71,240.15" fill="#b49371" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="534.50,590.94 587.30,590.94 587.30,565.86 534.50,565.86" fill="#74533e" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="236.84,583.35 337.16,583.35 337.16,540.45 236.84,540.45" fill="#74533e" stroke="#1f3336" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="782.00,420.00 650.00,420.00 425.60,420.00" fill="none" stroke="#bed4c9" stroke-width="92.39999999999999" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="782.00,420.00 650.00,420.00 425.60,420.00" fill="none" stroke="#236b67" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/>
<polyline points="560.90,517.02 287.00,484.68 316.70,317.70" fill="none" stroke="#9d4b2f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<circle cx="560.9" cy="517.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="560.9" y="521.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">1</text>
<circle cx="287.0" cy="484.7" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="287.0" y="488.7" text-anchor="middle" fill="white" font-weight="700" font-size="13">2</text>
<circle cx="316.7" cy="317.7" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="316.7" y="321.7" text-anchor="middle" fill="white" font-weight="700" font-size="13">3</text>
<text x="135.0" y="746.0" text-anchor="start" fill="#536668" font-weight="400" font-size="17">서쪽 벽</text>
<text x="720.0" y="746.0" text-anchor="start" fill="#536668" font-weight="400" font-size="17">동쪽 출입구</text>
<polyline points="130.00,790.00 196.00,790.00" fill="none" stroke="#1f3336" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="146.0" y="783.0" text-anchor="start" fill="#536668" font-weight="400" font-size="14">1 m</text>
<circle cx="918.0" cy="190.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="918.0" y="194.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">1</text>
<text x="942.0" y="195.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">접고 꿰매는 자리</text>
<text x="942.0" y="225.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">접지를 순서대로 놓고 실 지지대에 꿰맨다.</text>
<text x="942.0" y="249.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">상판 0.76 m, 걸상 좌면 0.44 m.</text>
<circle cx="918.0" cy="332.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="918.0" y="336.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">2</text>
<text x="942.0" y="337.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">서서 누르는 자리</text>
<text x="942.0" y="367.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">서쪽 상판 1.015 m 위에 기존 누름틀을 둔다.</text>
<text x="942.0" y="391.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">세로 나사 아래에 책과 누름판이 놓인다.</text>
<circle cx="918.0" cy="474.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="918.0" y="478.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">3</text>
<text x="942.0" y="479.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">건조한 대기 선반</text>
<text x="942.0" y="509.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">북벽에 폭 4.03 m, 깊이 0.55 m 선반을 둔다.</text>
<text x="942.0" y="533.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">묶음과 목판은 수평으로 보관한다.</text>
<circle cx="918.0" cy="616.0" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="918.0" y="620.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">→</text>
<text x="942.0" y="621.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">입구에서의 시야</text>
<text x="942.0" y="651.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">공방 도구에는 조작 표시를 주지 않는다.</text>
<text x="942.0" y="675.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">가운데 1.40 m 폭을 비워 작업을 볼 수 있다.</text>
<polyline points="44.00,873.00 1396.00,873.00" fill="none" stroke="#536668" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="44.0" y="909.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">걸상 외곽과 관람 통로 사이 보수적 여유 0.54 m  ·  공방 원화의 인물은 기물 크기를 판단하기 위한 기준</text>
<text x="1396.0" y="909.0" text-anchor="end" fill="#236b67" font-weight="700" font-size="16">망각의 서재  /  현행 제작 기준</text>
</svg>
