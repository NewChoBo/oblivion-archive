<title>무너진 회랑과 봉인 보관실  /  단서를 보고 빠져나오는 길</title><desc>북쪽 ↑  ·  본관 좌표(m)  ·  잔해, 봉인 받침, 원부대의 실제 바닥 치수 위에 다음 배치를 그렸다.</desc>
