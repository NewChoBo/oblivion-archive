<text x="44.0" y="56.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="32">무너진 회랑과 봉인 보관실  /  단서를 보고 빠져나오는 길</text>
<text x="44.0" y="92.0" text-anchor="start" fill="#536668" font-weight="400" font-size="17">북쪽 ↑  ·  본관 좌표(m)  ·  잔해, 봉인 받침, 원부대의 실제 바닥 치수 위에 다음 배치를 그렸다.</text>
