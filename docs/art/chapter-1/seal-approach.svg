<circle cx="657.1" cy="304.7" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="657.1" y="308.7" text-anchor="middle" fill="white" font-weight="700" font-size="13">2</text>
<circle cx="723.4" cy="376.1" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="723.4" y="380.1" text-anchor="middle" fill="white" font-weight="700" font-size="13">3</text>
<circle cx="1009.0" cy="304.7" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="1009.0" y="308.7" text-anchor="middle" fill="white" font-weight="700" font-size="13">4</text>
<circle cx="1029.4" cy="465.3" r="12" fill="#236b67" stroke="#f6f3e9" stroke-width="2"/>
<text x="1029.4" y="469.3" text-anchor="middle" fill="white" font-weight="700" font-size="13">5</text>
<text x="166.0" y="175.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">열람실에서 ↑</text>
<text x="590.0" y="175.0" text-anchor="start" fill="#236b67" font-weight="400" font-size="16">실선  이동·관찰    점선  받침 바깥 우회</text>
<polyline points="1240.00,185.00 1342.00,185.00" fill="none" stroke="#1f3336" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1274.0" y="175.0" text-anchor="start" fill="#536668" font-weight="400" font-size="14">2 m</text>
<circle cx="66.0" cy="544.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="66.0" y="548.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">1</text>
<text x="90.0" y="549.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">잉크가 닿기 전에 관찰</text>
<text x="90.0" y="579.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">북벽의 세 양각을 왼쪽부터 읽는다.</text>
<text x="90.0" y="603.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">벽화 앞 X 3.60에서 다음 봉인선이 보인다.</text>
<circle cx="528.0" cy="544.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="528.0" y="548.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">2</text>
<text x="552.0" y="549.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">쫓기다가 손을 쓰는 자리</text>
<text x="552.0" y="579.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">X 8.10의 봉인선을 지난 뒤 받침을 돌린다.</text>
<text x="552.0" y="603.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">잔해는 벽 가까이에 남겨 회피 동선을 읽게 한다.</text>
<circle cx="1000.0" cy="544.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="1000.0" y="548.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">3</text>
<text x="1024.0" y="549.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">받침 남쪽의 연속 통로</text>
<text x="1024.0" y="579.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">세 받침을 북쪽으로 0.46 m 함께 옮긴다.</text>
<text x="1024.0" y="603.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">남벽과 받침 사이 폭 1.20 m. 표식 순서를 유지한다.</text>
<circle cx="66.0" cy="707.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="66.0" y="711.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">4</text>
<text x="90.0" y="712.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">원부 읽기</text>
<text x="90.0" y="742.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">서쪽에서 읽으면 기록대가 앞, 빗장은 오른쪽이다.</text>
<text x="90.0" y="766.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">원부를 읽고 돌아설 자리에 소품을 추가하지 않는다.</text>
<circle cx="652.0" cy="707.0" r="12" fill="#9d4b2f" stroke="#f6f3e9" stroke-width="2"/>
<text x="652.0" y="711.0" text-anchor="middle" fill="white" font-weight="700" font-size="13">5</text>
<text x="676.0" y="712.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">빗장을 보고 귀환</text>
<text x="676.0" y="742.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">원부를 등지고 남쪽 문을 바라볼 때는 문이 선택된다.</text>
<text x="676.0" y="766.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">세 받침의 접근점과 글자도 받침과 함께 옮긴다.</text>
<polyline points="44.00,873.00 1396.00,873.00" fill="none" stroke="#536668" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="44.0" y="909.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">남쪽 통로 폭은 받침 단면을 지난 자리에서 측정  ·  회랑의 휨과 어깨 카메라를 포함한 통과 여부는 모델 배치 뒤 확인</text>
<text x="1396.0" y="909.0" text-anchor="end" fill="#236b67" font-weight="700" font-size="16">망각의 서재  /  현행 제작 기준</text>
</svg>
