<text x="956.0" y="406.0" text-anchor="start" fill="#1f3336" font-weight="700" font-size="21">착지와 인계</text>
<text x="956.0" y="436.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">X 30.50 / Z 12.80. 상자를 포장에 내린다.</text>
<text x="956.0" y="460.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">회전 중 상자 바닥은 +2.10 m를 유지한다.</text>
