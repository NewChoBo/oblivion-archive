<text x="956.0" y="322.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">X 30.50 / Z 8.20, 반경 4.60 m.</text>
<text x="956.0" y="346.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">고정 돌기초 위에서 상부 팔만 90° 돈다.</text>
