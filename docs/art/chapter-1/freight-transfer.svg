<text x="956.0" y="550.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">창고 동벽 Z 11.40에 미닫이문을 낸다.</text>
<text x="956.0" y="574.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">상자가 내려앉고 줄이 멎으면 작업자가 들어간다.</text>
