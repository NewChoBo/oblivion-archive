<text x="956.0" y="208.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">바깥 정지점 X 35.10 / Z 8.20.</text>
<text x="956.0" y="232.0" text-anchor="start" fill="#536668" font-weight="400" font-size="16">난간을 벗어난 자리에서 끌어올린다.</text>
